android-sdk-target = "37"
java-jvmTarget = "17"
java-languageLevel = "17"

kotestRunnerJunit5 = "6.2.5"
kotlin = "2.4.20"
ktor = "3.6.0"
composeMultiplatform = "1.12.0-alpha02"
composeMaterial3Adaptive = "1.3.0"
composeHotReload = "1.3.0-alpha01"
composeNavigation = "2.9.2"
compose-multiplatform-lifecycle = "2.11.0"

androidx-activity = "1.13.0"
androidx-annotation = "1.10.0"
androidx-appcompat = "1.8.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-test = "1.7.0"
coreKtx = "1.19.0"

kermit = "2.2.0"
kotlinx-io = "0.9.1"
coroutines = "1.11.0"
logbackClassic = "1.6.3"
materialIconsExtended = "1.7.3"
materialVersion = "1.14.0"
