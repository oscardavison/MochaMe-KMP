services:
  sync-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mochame-sync-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SQLITE_DB_PATH=/app/data/server-mochame.db
    volumes:
      - ./server-data:/app/data