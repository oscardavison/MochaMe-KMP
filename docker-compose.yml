services:
  sync-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mochame-relay-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SQLITE_DB_PATH=/app/data/server-mochame.db
      - SQLITE_DB_BACKUP_DIR=/app/data/backups
    volumes:
      - ./server-data:/app/data